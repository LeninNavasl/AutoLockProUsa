# Nginx configuration for AutoLock Pro USA static hosting

server {
    listen 80;
    listen [::]:80;
    server_name autolockprousa.com www.autolockprousa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autolockprousa.com www.autolockprousa.com;

    root /var/www/autolockprousa/dist;
    index index.html;

    # Security Headers
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), screen-wake-lock=()" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Immutable asset caching
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static file fallback
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Block sensitive dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
